name: Lifecycle Onboarding Emails

on:
  schedule:
    # Daily at UTC 23:00 (~ET 19:00 EDT / 18:00 EST = 北京 7:00 AM).
    # Lands AFTER twitter-digest-generate.yml (UTC 20:30 weekdays) and
    # twitter-digest-broadcast.yml (UTC 22:00 weekdays) so D0/D1/D2 emails
    # embed the current day's digest (lifecycle_scheduler._latest_twitter_digest_html).
    # Daily (not weekday-only) so weekend signups still get D0/D1/D2; on weekends
    # the scheduler falls back to the most recent weekday digest.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  send-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/lifecycle/onboarding-pass
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/cron/lifecycle/onboarding-pass")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $http_code"
          echo "Body: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::lifecycle onboarding pass returned HTTP $http_code"
            exit 1
          fi
