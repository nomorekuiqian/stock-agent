name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_INSFORGE_URL: https://fake.insforge.app
          NEXT_PUBLIC_INSFORGE_ANON_KEY: fake-key-for-ci

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "from app.main import app; print('Import OK')"
        env:
          ENVIRONMENT: test

      - name: Unit tests
        run: pytest tests/test_*_unit.py -v --timeout=60 --deselect tests/test_email_preferences_unit.py::TestBroadcastProdSegmentRouting::test_empty_segment_config_falls_back_to_audience
        env:
          ENVIRONMENT: test
          GOOGLE_API_KEY: fake-key-for-ci
          FMP_API_KEY: fake-key-for-ci
          RESEND_API_KEY: fake-key-for-ci
          INSFORGE_BASE_URL: https://fake.insforge.app
          INSFORGE_ANON_KEY: fake-key-for-ci

      - name: E2E tests (no external API)
        run: pytest tests/e2e/ -v --timeout=120 -k "not generate and not broadcast and not liquidity and not macro_cache and not macro_risk and not newsletter and not research and not stock_e2e and not stock_technical"
        env:
          ENVIRONMENT: test
          GOOGLE_API_KEY: fake-key-for-ci
          FMP_API_KEY: fake-key-for-ci
          RESEND_API_KEY: fake-key-for-ci
          INSFORGE_BASE_URL: https://fake.insforge.app
          INSFORGE_ANON_KEY: fake-key-for-ci

      - name: Notify on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failed on ${context.ref.replace('refs/heads/', '')}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Commit:** ${context.sha.slice(0,7)}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });

      - name: Startup check
        run: |
          timeout 10 python -c "
          import uvicorn, threading, time, urllib.request
          from app.main import app
          t = threading.Thread(target=uvicorn.run, args=(app,), kwargs={'host':'127.0.0.1','port':8765,'log_level':'error'}, daemon=True)
          t.start()
          time.sleep(3)
          resp = urllib.request.urlopen('http://127.0.0.1:8765/')
          assert resp.status == 200, f'Health check failed: {resp.status}'
          print('Startup OK')
          " 2>&1 || echo "Startup check skipped (timeout)"
        env:
          ENVIRONMENT: test
          GOOGLE_API_KEY: fake-key-for-ci
          FMP_API_KEY: fake-key-for-ci
          INSFORGE_BASE_URL: https://fake.insforge.app
          INSFORGE_ANON_KEY: fake-key-for-ci
