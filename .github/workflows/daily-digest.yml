name: Daily Personal Digest

on:
  schedule:
    # Run 15 min after daily report to avoid Resend rate limit (2 req/sec)
    # UTC 22:15 = 3:15 PM PDT (summer) / 2:15 PM PST (winter)
    - cron: '15 22 * * 1-5'  # Monday to Friday only (market days)
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-digests:
    runs-on: ubuntu-latest
    steps:
      - name: Send Personalized Digests
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/subscriptions/personal_digest/broadcast")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to send personal digests (HTTP $http_code)"
            exit 1
          fi

          # Also check success field in response body
          if echo "$body" | grep -q '"success":false'; then
            echo "Digest API returned success:false"
            exit 1
          fi

          # Parse response for summary
          total=$(echo "$body" | grep -o '"total":[0-9]*' | cut -d':' -f2)
          sent=$(echo "$body" | grep -o '"sent":[0-9]*' | cut -d':' -f2)
          failed=$(echo "$body" | grep -o '"failed":[0-9]*' | cut -d':' -f2)

          echo "Total subscribers: $total"
          echo "Sent: $sent"
          echo "Failed: $failed"

          # Show error details if any failures occurred
          if [ -n "$failed" ] && [ "$failed" -gt 0 ]; then
            errors=$(echo "$body" | grep -o '"errors":\[[^]]*\]' || true)
            echo "Error details: $errors"
          fi

          # Fail if more than 2 users failed (triggers GitHub notification)
          if [ -n "$failed" ] && [ "$failed" -gt 2 ]; then
            echo "::error::Too many failures: $failed users did not receive their digest"
            exit 1
          fi

          echo "Personal digests sent successfully!"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily Digest failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
