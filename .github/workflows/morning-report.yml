name: Morning Market Report

on:
  schedule:
    # Run at 9:00 AM US Eastern Time (before market open)
    # UTC 13:00 = 9:00 AM EDT (summer) / 8:00 AM EST (winter)
    - cron: '0 13 * * 1-5'  # Monday to Friday only (market days)
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-morning-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Morning Market Report
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/morning/broadcast?force=true")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to send morning report (HTTP $http_code)"
            exit 1
          fi

          # Also check success field in response body
          if echo "$body" | grep -q '"success":false'; then
            echo "Morning report API returned success:false"
            exit 1
          fi

          # Parse and validate sent count
          sent=$(echo "$body" | grep -o '"sent":[0-9]*' | cut -d':' -f2)
          total=$(echo "$body" | grep -o '"total":[0-9]*' | cut -d':' -f2)
          echo "Total: $total, Sent: $sent"

          if [ -n "$sent" ] && [ "$sent" -eq 0 ]; then
            echo "::error::Broadcast sent to 0 recipients - check audience configuration"
            exit 1
          fi

          echo "Morning report sent successfully!"
