name: Daily Sector Digest

on:
  schedule:
    # Run at 6:30 PM US Eastern Time (after market close, after daily report)
    # UTC 23:30 = 6:30 PM EST (winter) / 7:30 PM EDT (summer)
    - cron: '30 23 * * 1-5'  # Monday to Friday only (market days)
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-all-sectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Generating all sectors may take time
    steps:
      - name: Generate All Sector Digests
        run: |
          echo "Starting sector digest generation..."

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/sectors/generate-all")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to generate sector digests"
            exit 1
          fi

          # Parse and display results
          echo ""
          echo "=== Sector Digest Generation Complete ==="
          echo "$body" | jq -r '.message // "Generation completed"'
          echo ""
          echo "Results:"
          echo "$body" | jq -r '.results[] | "\(.sector_name): \(if .success then "Success" else "Failed - " + .error end)"'

          echo ""
          echo "All sector digests generated successfully!"
