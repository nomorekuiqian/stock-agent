name: Macro Data Cache Refresh

on:
  schedule:
    # T1 every 4h: 01:00, 05:00, 09:00, 13:00, 17:00 UTC
    - cron: '0 1,5,9,13,17 * * *'
    # T2 every 12h: 02:00, 14:00 UTC (offset 1h from T1 to avoid overlap)
    - cron: '0 2,14 * * *'
    # T3 every 24h: 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Refresh tier'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'

jobs:
  refresh:
    name: Refresh macro data cache
    runs-on: ubuntu-latest
    steps:
      - name: Determine tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ github.event.inputs.tier }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 1,5,9,13,17 * * *" ]; then
            echo "tier=1" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2,14 * * *" ]; then
            echo "tier=2" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "tier=3" >> $GITHUB_OUTPUT
          else
            echo "tier=all" >> $GITHUB_OUTPUT
          fi

      - name: Refresh tier ${{ steps.tier.outputs.tier }}
        run: |
          TIER="${{ steps.tier.outputs.tier }}"
          echo "Refreshing tier: $TIER"

          response=$(curl -s -w "\n%{http_code}" --max-time 180 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/macro-cache/refresh?tier=$TIER")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Code: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Tier $TIER refresh failed with HTTP $http_code"
            exit 1
          fi

          # Extract summary
          summary=$(echo "$body" | grep -o '"summary":"[^"]*"' | cut -d'"' -f4)
          echo "Result: $summary"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Macro Cache Refresh failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
