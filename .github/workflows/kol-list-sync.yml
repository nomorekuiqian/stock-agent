name: KOL Twitter List Sync

on:
  schedule:
    # Daily at Beijing 04:00 (UTC 20:00). Runs before the 05:30 enrichment cron
    # so any new list members get picked up by today's digest. List membership
    # changes are rare; once a day is plenty.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      list_id:
        description: "Twitter list ID to sync"
        required: false
        default: "1800707969811894542"

jobs:
  sync-list:
    runs-on: ubuntu-latest
    steps:
      - name: Sync KOL list members into kol_accounts
        run: |
          list_id="${{ github.event.inputs.list_id || '1800707969811894542' }}"

          response=$(curl -s -w "\n%{http_code}" \
            --retry 3 --retry-delay 30 --retry-connrefused --max-time 300 \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/twitter/sync-kol-list?list_id=${list_id}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::sync-kol-list returned HTTP $http_code"
            exit 1
          fi

          if echo "$body" | grep -q '"success":false'; then
            echo "::error::sync-kol-list returned success:false"
            exit 1
          fi

          fetched=$(echo "$body" | grep -o '"members_fetched":[0-9]*' | cut -d':' -f2)
          upserted=$(echo "$body" | grep -o '"upserted":[0-9]*' | cut -d':' -f2)
          disabled=$(echo "$body" | grep -o '"disabled_missing":[0-9]*' | cut -d':' -f2)
          echo "Sync summary -> fetched=${fetched:-0} upserted=${upserted:-0} disabled=${disabled:-0}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `KOL list sync failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
