name: Daily Market Report

on:
  schedule:
    # Run at 6:00 PM US Eastern Time (after market close)
    # UTC 23:00 = 6:00 PM EST (winter) / 7:00 PM EDT (summer)
    - cron: '0 23 * * 1-5'  # Monday to Friday only (market days)
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Market Report
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/subscriptions/daily_report/broadcast?force=true")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to send report (HTTP $http_code)"
            exit 1
          fi

          # Also check success field in response body
          if echo "$body" | grep -q '"success":false'; then
            echo "Report API returned success:false"
            exit 1
          fi

          echo "Daily report sent successfully!"
