name: Twitter KOL Digest Broadcast

on:
  schedule:
    # 北京 08:00 工作日(周一-周五)= UTC 00:00 Sun-Thu(北京 = UTC+8,周日 16:00 UTC 算
    # 是北京周一 00:00,以此类推)。
    # 上游 digest 在 UTC 22:00 Sun-Thu 生成,本任务给它 2 小时缓冲。
    # GitHub Actions cron 通常延迟 5-30 分钟,加上 enrichment + digest 流水线
    # 的处理时间(约 5 分钟),08:00 BJT 应该有完整的当日 digest 可发。
    - cron: '0 0 * * 1-5'
  workflow_dispatch:  # 手动触发(QA / 补发)
    inputs:
      date:
        description: "ISO YYYY-MM-DD; 为空则取 latest"
        required: false
        default: ""

jobs:
  broadcast-twitter-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast Twitter KOL digest
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="?date=${{ github.event.inputs.date }}"
          fi

          response=$(curl -s -w "\n%{http_code}" \
            --retry 2 --retry-delay 30 --retry-connrefused --max-time 600 \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/twitter-digest/broadcast${DATE_PARAM}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::twitter-digest broadcast returned HTTP $http_code"
            exit 1
          fi

          # The endpoint returns {success, total, sent, failed, errors}. The
          # earlier morning-report grep '"success":false' approach silently
          # misses cases where success is true but sent=0; we hard-fail on
          # both conditions explicitly here.
          success=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo "false")
          total=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo "0")
          sent=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sent',0))" 2>/dev/null || echo "0")
          failed=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('failed',0))" 2>/dev/null || echo "0")
          echo "Broadcast summary -> success=$success total=$total sent=$sent failed=$failed"

          if [ "$success" != "True" ] && [ "$success" != "true" ]; then
            echo "::error::broadcast returned success=false"
            exit 1
          fi

          if [ "$sent" = "0" ] && [ "$total" != "0" ]; then
            echo "::error::broadcast had $total recipients but sent 0 — Resend Batch likely failed"
            exit 1
          fi

          if [ "$total" = "0" ]; then
            # 0 entitled users in production is genuinely possible at MVP time.
            echo "::warning::no entitled subscribers — confirm Pro/Max users exist if this is unexpected"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Twitter KOL Digest Broadcast failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
