name: Twitter KOL Digest Generation

on:
  schedule:
    # ET 16:30 Mon-Fri = UTC 20:30 Mon-Fri (DST-aware: drifts to ET 15:30
    # during winter; accept the 1h seasonal shift rather than maintaining
    # two cron entries — the broadcast at UTC 22:00 (ET 18:00/17:00 EDT/EST)
    # still falls in the post-close window either way).
    # Triggered 30 min after US market close so the digest captures the
    # immediate post-close KOL reactions (closing prices, earnings calls,
    # after-hours moves). Enrich runs hourly via the fetch workflow, so the
    # data pool is already labelled when this fires.
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Look-back window for tweets (12-72)"
        required: false
        default: "24"
      persist:
        description: "Persist result to kol_daily_digests"
        required: false
        default: "true"

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Generate KOL Digest
        run: |
          window_hours="${{ github.event.inputs.window_hours || '24' }}"
          persist="${{ github.event.inputs.persist || 'true' }}"

          response=$(curl -s -w "\n%{http_code}" \
            --retry 3 --retry-delay 60 --retry-connrefused --max-time 900 \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/twitter-digest/generate?window_hours=${window_hours}&persist=${persist}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::digest generate returned HTTP $http_code"
            exit 1
          fi

          # Surface counts so the workflow run shows whether the day produced
          # enough material. Empty days are allowed (we don't backfill garbage),
          # so a 0-count is informational, not a fail.
          input_tweets=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('input_tweet_count',0))" 2>/dev/null || echo "0")
          theses=$(echo "$body" | python3 -c "import json,sys;print(len(json.load(sys.stdin).get('ticker_theses',[])))" 2>/dev/null || echo "0")
          macros=$(echo "$body" | python3 -c "import json,sys;print(len(json.load(sys.stdin).get('macro_threads',[])))" 2>/dev/null || echo "0")
          watchpoints=$(echo "$body" | python3 -c "import json,sys;print(len(json.load(sys.stdin).get('watchpoints',[])))" 2>/dev/null || echo "0")
          echo "Digest summary -> input_tweets=$input_tweets ticker_theses=$theses macro_threads=$macros watchpoints=$watchpoints"

          if [ "$input_tweets" = "0" ]; then
            echo "::warning::generated digest had 0 input tweets — KOL ingestion may be lagging"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Twitter KOL Digest generation failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
