name: Onboarding Drip Campaign (Deprecated)

# DEPRECATED — replaced by `lifecycle-onboarding.yml` after the freemium
# transition (see docs/plans/active/freemium-lifecycle-email.md). The old
# trial-tied drip can no longer fire useful emails because new users do not
# get auto trials. Workflow retained briefly so legacy trial users still
# winding down can be manually re-triggered if needed; the schedule is
# disabled to stop daily noise.
on:
  workflow_dispatch:  # Manual-only trigger; scheduled cron removed

jobs:
  send-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Send Onboarding Drip Emails
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/cron/onboarding-emails")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to send onboarding emails (HTTP $http_code)"
            exit 1
          fi

          if echo "$body" | grep -q '"success":false'; then
            echo "Onboarding API returned success:false"
            exit 1
          fi

          processed=$(echo "$body" | grep -o '"processed":[0-9]*' | cut -d':' -f2)
          sent=$(echo "$body" | grep -o '"sent":[0-9]*' | cut -d':' -f2)
          skipped=$(echo "$body" | grep -o '"skipped":[0-9]*' | cut -d':' -f2)
          errors=$(echo "$body" | grep -o '"errors":[0-9]*' | cut -d':' -f2)

          echo "Processed: $processed"
          echo "Sent: $sent"
          echo "Skipped: $skipped"
          echo "Errors: $errors"

          if [ -n "$errors" ] && [ "$errors" -gt 0 ]; then
            echo "::warning::$errors onboarding emails failed to send"
          fi

          echo "Onboarding drip campaign completed!"
