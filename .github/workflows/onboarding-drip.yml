name: Onboarding Drip Campaign

# Daily cron: Day 3/7/14 onboarding emails anchored on auth_created_at.
# Idempotent via subscriptions.lifecycle_state.onboarding_sent.
on:
  schedule:
    # Daily at UTC 23:00 (~ET 19:00 EDT / 18:00 EST = 北京 7:00 AM).
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  send-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Send Onboarding Drip Emails
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/cron/onboarding-emails")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to send onboarding emails (HTTP $http_code)"
            exit 1
          fi

          if echo "$body" | grep -q '"success":false'; then
            echo "Onboarding API returned success:false"
            exit 1
          fi

          processed=$(echo "$body" | grep -o '"processed":[0-9]*' | cut -d':' -f2)
          sent=$(echo "$body" | grep -o '"sent":[0-9]*' | cut -d':' -f2)
          skipped_already=$(echo "$body" | grep -o '"skipped_already":[0-9]*' | cut -d':' -f2)
          skipped_other=$(echo "$body" | grep -o '"skipped_other":[0-9]*' | cut -d':' -f2)
          errors=$(echo "$body" | grep -o '"errors":[0-9]*' | cut -d':' -f2)

          echo "Processed: $processed"
          echo "Sent: $sent"
          echo "Skipped (already sent): $skipped_already"
          echo "Skipped (other): $skipped_other"
          echo "Errors: $errors"

          if [ -n "$errors" ] && [ "$errors" -gt 0 ]; then
            echo "::warning::$errors onboarding emails failed to send"
          fi

          echo "Onboarding drip campaign completed!"
