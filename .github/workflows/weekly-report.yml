name: Weekly Macro Report

on:
  schedule:
    # Run at 12:00 PM US Eastern Time every Sunday
    # UTC 17:00 = 12:00 PM EST (winter) / 1:00 PM EDT (summer)
    - cron: '0 17 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Weekly Macro Report
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 300 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/weekly-report/generate")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Failed to generate weekly report (HTTP $http_code)"
            exit 1
          fi

          if echo "$body" | grep -q '"success":false'; then
            echo "Weekly report API returned success:false"
            exit 1
          fi

          # Parse broadcast outcome from response body. The /generate endpoint
          # returns success:true even when the email broadcast itself fails or
          # is skipped, so the cron must inspect broadcast_result explicitly.
          from_cache=$(echo "$body" | jq -r '.from_cache // false')
          br_success=$(echo "$body" | jq -r '.broadcast_result.success // "missing"')
          br_error=$(echo "$body" | jq -r '.broadcast_result.error // ""')

          if [ "$from_cache" = "true" ]; then
            echo "Weekly report already exists for this week (cached) - broadcast skipped"
          elif [ "$br_success" = "missing" ]; then
            echo "Broadcast was skipped or threw an unhandled exception"
            exit 1
          elif [ "$br_success" != "true" ]; then
            echo "Broadcast failed: $br_error"
            exit 1
          else
            echo "Weekly report generated and broadcast sent successfully!"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly Report failed on ${new Date().toISOString().slice(0,10)}`;
            const body = `**Workflow:** ${context.workflow}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Triggered by:** ${context.actor}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
