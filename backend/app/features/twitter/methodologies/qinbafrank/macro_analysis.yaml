      - tweet_id: "2044677096526741639"
        quote: "3、当然我也不是全对"
veto_rules:
  - rule: "切勿将地缘政治或单方意愿进行“线性外推”"
    rationale: "大国博弈和地缘冲突受制于各自的国内经济、政权稳定等现实硬约束。不能因为某国军事实力强就认为能随意速胜，也不能因为政客发了强硬推文就认为一定会无底线升级，战争需要双方共同让步。"
    evidence:
      - tweet_id: "2044677096526741639"
        quote: "去年关税站川普TACO有效，认为今年伊朗战争川普单方面TACO也有效，忽略了战争需要双方共同让步共同TACO才行。"
      - tweet_id: "2038850566856860039"
        quote: "在我的推文里，我尽力避免的就是大旗党思维，而且根据我看到各方面信息和观察到的态势，尽量是客观的推演。"
  - rule: "基本面优先原则（不可因宏观噪音抛售强基本面资产）"
    rationale: "在美股等成熟市场，影响资产定价的第一要素始终是产业基本面（如盈利和资本开支回报）。宏观逆风和地缘扰动只是次要因素，只能造成估值杀跌，不能改变资产长期逻辑。"
    evidence:
      - tweet_id: "2044677096526741639"
        quote: "一定要有基本面视角，股价进入高性价比区间就是可以逐步建仓的；"
      - tweet_id: "1984556367093395469"
        quote: "在一个基本面主导的市场要紧盯产业进展和业绩增下，而不是其他。"
falsifiability_rules:
  - thesis: "地缘政治缓和 / 美国在中东取得体面谈判结果"
    falsifier: "如果伊朗长期维持对霍尔木兹海峡的封锁，并成功使收取过路费的行为常态化，则意味着美国实质性退出波斯湾，所谓的“降级”和“胜利”叙事被证伪。"
    evidence:
      - tweet_id: "2038832299136209048"
        quote: "那就收费常态化，正好早上看伊朗议会已经通过了霍尔木兹海峡通行费的提案"
      - tweet_id: "2035159105925722588"
        quote: "只有伊朗不收过路费的海峡正常通航对美国来才算是体面的结果。"
  - thesis: "美元流动性将随着政府停摆结束和美联储停止缩表而完全恢复"
    falsifier: "如果财政部TGA账户余额下降（泄洪）且美联储停止QT，但美国商业银行准备金余额并未随之回升至 3.2 万亿美元的中位数上方，且 SOFR 仍频频刺破上限，则说明系统性缺水，流动性恢复的逻辑被证伪，必须依赖联储彻底的购债扩表(RMP)。"
    evidence:
      - tweet_id: "1986425294576885933"
        quote: "12月初美联储正式停止缩表，停止缩表不代表着就能理解扩表，但是资产负债表不再继续下降也能缓解流动性紧张的状况"
      - tweet_id: "1998850554278351088"
        quote: "正常来说过去三年银行准备金的最低点2.8万亿美金，最高点3.6万亿美金，中位数是3.2万亿美金"
  - thesis: "美联储维持顺畅的连续降息路径"
    falsifier: "如果油价因中东冲突持续高企，或关税政策传导至国内导致CPI/PCE核心通胀数据环比和同比出现实质性反弹超预期，则联储将被迫陷入滞胀担忧，持续降息的叙事将被证伪。"
    evidence:
      - tweet_id: "2022477925199810813"
        quote: "明年某个时候会看到商品通胀的环比下降甚至负增长的状态，只有环比负增长才能说物价走低"
      - tweet_id: "1988469900541833624"
        quote: "10月、11月的通胀数据不要超预期，通胀走势，这是决定12月能否持续降息的重要依据。"
