analyst: "qinbafrank"
category: "methodology"
source_tweet_count: 53
methodology_version: "v1.0"
prompt_version: "v1.1"
data_preferences:
  - name: "市场调整定性指标 (杀估值/杀业绩/杀逻辑)"
    frequency: "high"
    description: "通过分辨市场下跌是由于情绪错杀(估值)、短期不及预期(业绩)还是底层支撑破裂(逻辑)，来决定是加仓还是止损。"
    evidence:
      - tweet_id: "1986633517087007159"
        quote: "杀逻辑则是投资逻辑的根本性动摇。"
      - tweet_id: "1986633517087007159"
        quote: "面对市场调整的时候，有基本面的标的其实需要去预判看到底是哪一种因素导致了股价的调整"
  - name: "大科技资本开支与财报前瞻 (Tech CapEx)"
    frequency: "medium"
    description: "利用头部科技公司的资本开支指引来验证AI算力等基础设施产业链的订单确定性和营收增长。"
    evidence:
      - tweet_id: "2022872651157618795"
        quote: "更炸裂的是资本开支指引、26年资本开支比25年翻倍，比市场预期要高50%"
      - tweet_id: "2044070965886497138"
        quote: "验证一季度火热的AI代理热潮是不是能带动大科技云业务的火爆，毕竟算力即收入。"
  - name: "地缘政治时间线与谈判节奏约束"
    frequency: "medium"
    description: "关注法定时间期限(如60天战争权力法)及施压节奏(如周末发布关税)以判断宏观冲击的持续性与真实意图。"
    evidence:
      - tweet_id: "2044070965886497138"
        quote: "美国对外军事行动时间期限就是60天源于1973年的《战争权力法》，60天之内总统可以决策。"
      - tweet_id: "2013046337827475776"
        quote: "川普的目标是让这些关税永远不会真正实施，他想要的是协议。这也解释了为何这些公告越来越频繁地出现在周末"
analytical_process:
  - order: 1
    description: "剥离宏大叙事，确认核心驱动逻辑。避免盲目线性外推，从传导逻辑和金融心理学角度寻找占据主导的逻辑主线。"
    evidence:
      - tweet_id: "2044677113945669726"
        quote: "对于投资最重要的事实事求是、客观、理解传导逻辑"
  - order: 2
    description: "拷问商业模式质量与业绩可持续性。确认标的是否具备需求刚性与护城河，脱离基本面的单纯估值指标无意义。"
    evidence:
      - tweet_id: "2020093693819289895"
        quote: "脱离这三个变量，单纯的估值指标毫无意义。"
  - order: 3
    description: "判定市场调整性质并执行决策。预判当前调整属于杀估值(逢低买入)、杀业绩(观望)还是杀逻辑(坚决清仓)。"
    evidence:
      - tweet_id: "1986633517087007159"
        quote: "面对市场调整的时候，有基本面的标的其实需要去预判看到底是哪一种因素导致了股价的调整"
decision_criteria:
  - condition: "结构性变革确立且市场认知滞后"
    direction: "bullish"
    weight: "high"
    evidence:
      - tweet_id: "2028389125594993010"
        quote: "投资的关键不是预测财报，而是预判市场未来如何重新理解一个资产"
  - condition: "底层投资逻辑发生根本性改变或技术路线失败"
    direction: "bearish"
    weight: "veto"
    evidence:
      - tweet_id: "1986633517087007159"
        quote: "杀逻辑是最致命的，相当于最底层的投资逻辑发生了变化和动摇。对股价的打击往往更深远"
  - condition: "大盘引发恐慌性下杀，但个股核心逻辑未破裂(杀估值)"
    direction: "bullish"
    weight: "medium"
    evidence:
      - tweet_id: "2044070965886497138"
        quote: "个股大幅杀跌进入高性价比区间后、是可以忽略大盘建仓的。上周其实已经在逐步买入"
communication_patterns:
  - context: "high_conviction"
    typical_phrases:
      - "真正理解了这个趋势的底层逻辑"
      - "对此有足够的信心"
      - "全力推动"
    evidence:
      - tweet_id: "2047253255466660277"
        quote: "站在光里的，是真正理解了这个趋势的底层逻辑、并且对此有足够的信心"
      - tweet_id: "2013804731253022728"
        quote: "美国的政策制定者正在全力推动所有的资产/证券全方面从链下往链上迁移"
  - context: "risk_warning"
    typical_phrases:
      - "高杠杆永远是双刃剑"
      - "没有研究支撑的信仰"
      - "实际上很危险"
    evidence:
      - tweet_id: "2047253255466660277"
        quote: "没有研究支撑的信仰，只有FOMO的心和all in的账户"
      - tweet_id: "2021604575506210945"
        quote: "高杠杆永远是双刃剑，高收益伴随着大风险，其实需要更加谨慎。"
  - context: "hedge"
    typical_phrases:
      - "调整推演和判断"
      - "改变判断，不是错误"
      - "认知必须持续更新"
    evidence:
      - tweet_id: "2042192746954514826"
        quote: "地缘局势演化很快、我也会根据形势的变化来调整推演和判断。"
      - tweet_id: "2028389125594993010"
        quote: "市场是动态系统，认知必须持续更新。"
veto_rules:
  - rule: "拒绝跨出能力圈投资"
    rationale: "无法深刻理解的资产难以在波动中拿住，任何风吹草动都会导致高买低卖，亏损手续费。"
    evidence:
      - tweet_id: "2047253255466660277"
        quote: "这个赛道不在自己的能力圈里。所以他们选择弱水三千只取一瓢。"
      - tweet_id: "2047253255466660277"
        quote: "拿不住的资产，说明你不够了解它。"
  - rule: "拒绝无研报支撑的FOMO裸奔"
    rationale: "纯粹被市场氛围裹挟而盲目跟风，即使短期赚钱也极度危险，会固化错误的投资习惯并让人轻视体系。"
    evidence:
      - tweet_id: "2047253255466660277"
        quote: "既不懂这个行业，也没有做好功课，纯粹被周围的氛围裹挟"
falsifiability_rules:
  - thesis: "AI具备非线性暴增的商业价值"
    falsifier: "AI的智力水平无法越过社会平均智力成本的拐点(达不到60分及格线)。"
    evidence:
      - tweet_id: "2048051142975008855"
        quote: "本质上是AI越过社会智力成本的拐点，一旦越过，AI价值的确是非线性上升。所以AI不到60分就是0。"
      - tweet_id: "2025862041836069242"
        quote: "一旦越过，AI价值的确是非线性上升，所以AI不到60分就是0。"
  - thesis: "地缘冲突会导致市场持续恐慌"
    falsifier: "冲突期限超过法律容忍度(如60天战争权力法)且未获国会批准，或市场已将最差情景计入定价。"
    evidence:
      - tweet_id: "2044070965886497138"
        quote: "越往后市场也会看到这一点、战争本身对市场的影响开始变小。"
  - thesis: "代币经济与加密资产具备长期应用潜力"
    falsifier: "代币体系仅在原生Crypto应用内空转，未能与传统真实价值业务相融合或未能成为AI智能体的支付结算媒介。"
    evidence:
      - tweet_id: "2019621023344382189"
        quote: "只有真实有价值创造的业务才能让代币经济正向循环起来，不然所谓的代币经济还是在空转"
insufficient_evidence_notes:
[]
